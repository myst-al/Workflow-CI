name: CI - Train and Build Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  DOCKERHUB_IMAGE_NAME: telco-churn-model

jobs:
  train-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install mlflow==2.19.0 pandas==2.2.3 numpy==1.26.4 scikit-learn==1.5.2

      # env-manager=local reuses this job's already-installed dependencies
      # instead of having MLflow build a fresh conda env from conda.yaml,
      # which is slow and flaky on hosted runners.
      - name: Run MLflow Project training
        working-directory: MLProject
        run: |
          mlflow run . --env-manager=local --experiment-name telco-churn-ci | tee mlflow_run.log
          RUN_ID=$(grep -oE 'RUN_ID:[a-f0-9]+' mlflow_run.log | tail -1 | cut -d: -f2)
          echo "Trained run id: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Commit MLflow run artifacts back to repo
        working-directory: MLProject
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f mlruns
          git diff --cached --quiet || git commit -m "chore: add MLflow run ${RUN_ID} artifacts [automated]"
          git push

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image from MLflow model
        working-directory: MLProject
        run: mlflow models build-docker -m "runs:/${RUN_ID}/model" -n "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE_NAME }}"

      - name: Push Docker image to Docker Hub
        run: docker push "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE_NAME }}"
